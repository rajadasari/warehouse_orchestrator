server:
  port: ${SERVER_PORT:8084}

grpc:
  server:
    port: ${GRPC_PORT:9094}

spring:
  application:
    name: wcs-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:warehouse_db}?currentSchema=wcs&sslmode=disable
    username: ${DB_USERNAME:warehouse_app}
    password: ${DB_PASSWORD:warehouse_secure_pass_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: WcsHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: wcs
        format_sql: false
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    schemas: wcs
    default-schema: wcs
    table: flyway_schema_history
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-missing-migrations: true
    validate-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

wcs:
  opcua:
    default-request-timeout-ms: 5000
    auto-start-servers: true
    auto-connect-clients: false
