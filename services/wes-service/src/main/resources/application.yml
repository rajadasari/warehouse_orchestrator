server:
  port: ${SERVER_PORT:8086}

grpc:
  server:
    port: ${GRPC_PORT:9092}

spring:
  application:
    name: wes-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:[::1]}:${DB_PORT:5432}/${DB_NAME:warehouse_db}?currentSchema=wes
    username: ${DB_USERNAME:warehouse_app}
    password: ${DB_PASSWORD:warehouse_secure_pass_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: WesHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: wes
        format_sql: false
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    schemas: wes
    default-schema: wes
    table: flyway_schema_history
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-missing-migrations: true
    validate-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

wes:
  wms:
    base-url: ${WMS_BASE_URL:http://localhost:8080}
    token-path: ${WMS_TOKEN_PATH:/WMS.Api/api/authentication}
    client-id: ${WMS_CLIENT_ID:demo-client-id}
    client-secret: ${WMS_CLIENT_SECRET:demo-client-secret}
    connect-timeout-ms: ${WMS_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${WMS_READ_TIMEOUT_MS:10000}
    target-resource-id: ${WMS_TARGET_RESOURCE_ID:LOGIQS-AMBIENT-WMS}

