server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/auth/**
        - id: wes-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/wes/**, /api/v1/master-data/**, /api/v1/pallets/**
        - id: wms-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/wms/**
        - id: wcs-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/wcs/**
        - id: asrs-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/asrs/**
        - id: fleet-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/fleet/**

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
